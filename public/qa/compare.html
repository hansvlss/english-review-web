<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>复习页视觉对比</title>
    <style>
      * { box-sizing: border-box; }
      body { margin: 0; padding: 34px; background: #eef1f5; color: #111827; font: 14px/1.5 system-ui, sans-serif; }
      main { display: flex; gap: 30px; align-items: flex-start; justify-content: center; }
      figure { margin: 0; }
      figcaption { margin-bottom: 10px; font-weight: 700; }
      img { display: block; width: 393px; height: 852px; background: #fff; box-shadow: 0 10px 35px rgba(16, 24, 40, .12); }
    </style>
  </head>
  <body>
    <main>
      <figure><figcaption>第 2 稿视觉基准</figcaption><img src="./reference.png" alt="第 2 稿复习页" /></figure>
      <figure><figcaption>当前实现（iPhone 393×852）</figcaption><img src="./implementation.png" alt="当前网页版复习页" /></figure>
    </main>
  </body>
</html>
